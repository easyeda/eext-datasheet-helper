<!DOCTYPE html>
<html lang="zh-Hans">
<head>
	<title>PDF 助手</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="/iframe/style.css" />
</head>
<body>
	<div id="app">
		<!-- Header -->
		<div class="header">
			<h1 id="page-title"></h1>
			<div class="header-actions">
				<button id="btn-clear" class="btn-icon" title="">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
				</button>
			</div>
		</div>

		<!-- Upload Area -->
		<div id="upload-area" class="upload-area">
			<div class="upload-icon">
				<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9,15 12,12 15,15"/></svg>
			</div>
			<p class="upload-text" id="upload-text"></p>
			<p class="upload-hint" id="upload-hint"></p>
			<input type="file" id="file-input" accept=".pdf" hidden />
		</div>

		<!-- PDF Info Bar -->
		<div id="pdf-info" class="pdf-info hidden">
			<div class="pdf-info-content">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
				<span id="pdf-name">-</span>
				<span id="pdf-pages" class="pdf-pages">-</span>
			</div>
			<button id="btn-remove-pdf" class="btn-icon btn-small" title="">
				<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
			</button>
		</div>

		<!-- Chat Messages -->
		<div id="chat-messages" class="chat-messages">
			<div class="welcome-message">
				<p id="welcome-1"></p>
				<p id="welcome-2"></p>
			</div>
		</div>

		<!-- Input Area -->
		<div class="input-area">
			<div class="input-wrapper">
				<textarea id="user-input" placeholder="" rows="1" disabled></textarea>
				<button id="btn-send" class="btn-send" disabled>
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/></svg>
				</button>
			</div>
			<p class="input-hint" id="input-hint"></p>
		</div>
	</div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
	<script>
	var edaObj = (typeof eda !== 'undefined') ? eda : (window.parent && window.parent.eda);
	function t(tag) {
		if (edaObj && edaObj.sys_I18n) return edaObj.sys_I18n.text(tag);
		return tag;
	}
	function tArgs(tag, ...args) {
		if (edaObj && edaObj.sys_I18n) return edaObj.sys_I18n.text(tag, undefined, undefined, ...args);
		return tag;
	}
	document.title = t('PDF 助手');
	document.getElementById('page-title').textContent = t('PDF 助手');
	document.getElementById('btn-clear').title = t('清空对话');
	document.getElementById('upload-text').textContent = t('拖拽 PDF 到此处或点击上传');
	document.getElementById('upload-hint').textContent = t('支持 .pdf 文件');
	document.getElementById('btn-remove-pdf').title = t('移除 PDF');
	document.getElementById('welcome-1').textContent = t('你好！我是你的 PDF 助手。');
	document.getElementById('welcome-2').textContent = t('上传 PDF 文件后，可以向我提问任何关于文档内容的问题。');
	document.getElementById('user-input').placeholder = t('询问 PDF 内容...');
	document.getElementById('input-hint').textContent = t('按回车发送，Shift+回车换行');
	</script>
	<script src="/iframe/app.js"></script>
</body>
</html>
